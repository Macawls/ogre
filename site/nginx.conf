server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed Astro assets — safe to cache aggressively.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Pretty URLs: /docs/ → /docs/index.html; /foo → /foo.html or /foo/index.html.
  location / {
    try_files $uri $uri/ $uri.html $uri/index.html =404;
  }

  # Text files agents/crawlers hit — ensure text/plain and are always reachable.
  location = /robots.txt        { access_log off; try_files $uri =404; }
  location = /sitemap-index.xml { access_log off; try_files $uri =404; }
  location = /llms.txt          { access_log off; add_header Content-Type "text/plain; charset=utf-8"; try_files $uri =404; }
  location = /llms-full.txt     { access_log off; add_header Content-Type "text/plain; charset=utf-8"; try_files $uri =404; }

  error_page 404 /404.html;
}
